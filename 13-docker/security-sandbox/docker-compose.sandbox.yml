# Docker Compose 沙盒環境（新版 Compose 不需要 version: 欄位）
# 使用方式: docker compose -f docker-compose.sandbox.yml run --rm sandbox

services:
  sandbox:
    image: node:22
    working_dir: /app

    # 安全設定
    security_opt:
      - no-new-privileges:true

    # 限制資源（防止挖礦或 fork bomb）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

    # 對外 port（視需要開啟）
    ports:
      - "3000:3000"
      - "5173:5173"
      - "8080:8080"

    # 持久化工作目錄
    volumes:
      - sandbox_data:/app

    # 互動模式
    stdin_open: true
    tty: true

    # 預設使用 bash
    command: bash

    # 網路設定（可選擇更嚴格的隔離）
    networks:
      - sandbox_net

networks:
  sandbox_net:
    driver: bridge
    # 取消註解以完全隔離網路（無法連外網）
    # internal: true

volumes:
  sandbox_data:
