# 開發環境 Docker Compose
services:
  # Node.js API 服務（開發模式）
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://admin:secret123@db:5432/notes_app
    volumes:
      # 掛載本地程式碼，實現 hot reload
      - .:/app
      # 排除 node_modules，使用容器內的版本
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL 資料庫
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=notes_app
    ports:
      # 開發時暴露資料庫連接埠，方便用工具連線
      # 使用 5433 避免與本地 PostgreSQL 衝突
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d notes_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
